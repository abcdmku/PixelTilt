<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="2.4" fill="#94a3b8"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M1,1 L4,7 L7,1" fill="none" stroke="#6b7280" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="1000" height="780" fill="#f8fafc"/>

  <!-- Title -->
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">PixelTilt — wiring overview (panel rear view)</text>
  <text x="40" y="72" font-size="14" fill="#64748b">HUB75 S3 board top-left on the IN socket · GY-BNO08X mid-panel · UART-RVC harness</text>

  <!-- USB cable exiting the top -->
  <path d="M201,110 C201,74 212,58 220,34" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <text x="238" y="46" font-size="12" fill="#475569">USB-C — power + flashing</text>

  <!-- ============ 64x64 panel, rear ============ -->
  <rect x="60" y="100" width="560" height="560" rx="12" fill="#1f242b" stroke="#3a4149" stroke-width="2"/>
  <!-- frame ribs -->
  <line x1="60" y1="240" x2="620" y2="240" stroke="#272d35" stroke-width="2"/>
  <line x1="60" y1="380" x2="620" y2="380" stroke="#272d35" stroke-width="2"/>
  <line x1="60" y1="520" x2="620" y2="520" stroke="#272d35" stroke-width="2"/>
  <!-- mounting holes -->
  <g fill="#0c0f12" stroke="#4b5563">
    <circle cx="86"  cy="126" r="8"/><circle cx="594" cy="126" r="8"/>
    <circle cx="86"  cy="634" r="8"/><circle cx="594" cy="634" r="8"/>
    <circle cx="340" cy="126" r="8"/><circle cx="340" cy="634" r="8"/>
    <circle cx="86"  cy="380" r="8"/><circle cx="594" cy="380" r="8"/>
  </g>
  <text x="480" y="640" font-size="12" fill="#6b7280" text-anchor="middle">64 × 64 HUB75 panel (rear)</text>

  <!-- panel power sockets on the left edge (harness into the top one) -->
  <rect x="68" y="415" width="38" height="54" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <g fill="#9ca3af">
    <rect x="76" y="423" width="22" height="6"/><rect x="76" y="435" width="22" height="6"/>
    <rect x="76" y="447" width="22" height="6"/><rect x="76" y="459" width="22" height="6"/>
  </g>
  <rect x="68" y="482" width="38" height="54" rx="3" fill="#4b5563" opacity="0.55" stroke="#6b7280"/>
  <text x="87" y="556" font-size="9" fill="#9ca3af" text-anchor="middle">panel PWR</text>
  <text x="87" y="568" font-size="9" fill="#6b7280" text-anchor="middle">(lower: spare)</text>

  <!-- OUT socket, below the (hidden) IN socket -->
  <rect x="240" y="430" width="34" height="96" rx="3" fill="#0b0e11" stroke="#52606d"/>
  <g fill="#d4af37">
    <circle cx="250" cy="440" r="2"/><circle cx="264" cy="440" r="2"/>
    <circle cx="250" cy="452" r="2"/><circle cx="264" cy="452" r="2"/>
    <circle cx="250" cy="464" r="2"/><circle cx="264" cy="464" r="2"/>
    <circle cx="250" cy="476" r="2"/><circle cx="264" cy="476" r="2"/>
    <circle cx="250" cy="488" r="2"/><circle cx="264" cy="488" r="2"/>
    <circle cx="250" cy="500" r="2"/><circle cx="264" cy="500" r="2"/>
    <circle cx="250" cy="512" r="2"/><circle cx="264" cy="512" r="2"/>
  </g>
  <text x="284" y="474" font-size="11" fill="#9ca3af">OUT (unused)</text>

  <!-- silkscreen data arrow: IN (under board) -> OUT -->
  <line x1="257" y1="388" x2="257" y2="420" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="270" y="404" font-size="10" fill="#6b7280">data</text>

  <!-- ============ Seengreat HUB75 S3 board (top-left, on the IN socket) ============ -->
  <rect x="100" y="115" width="220" height="260" rx="8" fill="#14161c" stroke="#6b7280" stroke-width="2"/>
  <text x="212" y="132" font-size="10" fill="#cbd5e1" text-anchor="middle">Seengreat RGB Matrix HUB75 S3</text>

  <!-- USB-C x2 on the top edge -->
  <rect x="142" y="103" width="30" height="14" rx="5" fill="#cbd5e1" stroke="#64748b"/>
  <rect x="186" y="103" width="30" height="14" rx="5" fill="#cbd5e1" stroke="#64748b"/>
  <text x="157" y="97" font-size="8" fill="#94a3b8" text-anchor="middle">Power</text>
  <text x="201" y="97" font-size="8" fill="#94a3b8" text-anchor="middle">USB-C</text>

  <!-- BOOT / EN buttons -->
  <rect x="150" y="138" width="12" height="10" rx="2" fill="#d1d5db"/>
  <rect x="172" y="138" width="12" height="10" rx="2" fill="#d1d5db"/>
  <text x="167" y="160" font-size="7.5" fill="#94a3b8" text-anchor="middle">BOOT · EN</text>

  <!-- thumb wheel, top-right corner -->
  <circle cx="296" cy="140" r="15" fill="#caa64b" stroke="#8a6d1f" stroke-width="2"/>
  <text x="296" y="166" font-size="8" fill="#94a3b8" text-anchor="middle">wheel</text>
  <circle cx="268" cy="162" r="3" fill="#ef4444"/>
  <text x="268" y="175" font-size="7" fill="#ef4444" text-anchor="middle">PWR</text>

  <!-- I2C 1mm connector (unused in UART-RVC build) -->
  <rect x="302" y="196" width="13" height="28" rx="2" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="308" y="236" font-size="7.5" fill="#94a3b8" text-anchor="middle">I2C</text>

  <!-- speaker -->
  <circle cx="175" cy="212" r="32" fill="#0b0d10" stroke="#2d333c" stroke-width="4"/>
  <circle cx="175" cy="212" r="13" fill="#1f242b"/>
  <text x="175" y="256" font-size="7.5" fill="#6b7280" text-anchor="middle">speaker</text>

  <!-- ESP32-S3 module -->
  <rect x="252" y="252" width="52" height="88" rx="3" fill="#aab3bd" stroke="#7b8794"/>
  <rect x="252" y="252" width="52" height="15" fill="#c9d1d9"/>
  <text transform="rotate(-90 278 298)" x="278" y="301" font-size="9" font-weight="600" fill="#1f2937" text-anchor="middle">ESP32-S3</text>

  <!-- microSD -->
  <rect x="306" y="252" width="12" height="22" rx="2" fill="#cbd5e1" stroke="#64748b"/>
  <text x="312" y="286" font-size="7" fill="#94a3b8" text-anchor="middle">SD</text>

  <!-- left-edge pin header (RST...IO46, read bottom to top) -->
  <rect x="100" y="162" width="12" height="156" fill="#0b0d10"/>
  <g stroke="#92702a">
    <circle cx="106" cy="170" r="2.8" fill="#d4af37"/>
    <circle cx="106" cy="185" r="2.8" fill="#d4af37"/>
    <circle cx="106" cy="200" r="2.8" fill="#d4af37"/>
    <circle cx="106" cy="215" r="2.8" fill="#d4af37"/>
    <circle cx="106" cy="230" r="2.8" fill="#d4af37"/>
    <circle cx="106" cy="245" r="2.8" fill="#d4af37"/>
    <circle cx="106" cy="260" r="2.8" fill="#d4af37"/>
    <circle cx="106" cy="275" r="2.8" fill="#d4af37"/>
    <circle cx="106" cy="290" r="2.8" fill="#d4af37"/>
    <circle cx="106" cy="305" r="2.8" fill="#d4af37"/>
  </g>
  <g font-size="7.5">
    <text x="118" y="173" fill="#6b7280">IO46</text>
    <text x="118" y="188" fill="#d1fae5" font-weight="700">GND</text>
    <text x="118" y="203" fill="#d1fae5" font-weight="700">3V3</text>
    <text x="118" y="218" fill="#6b7280">IO45</text>
    <text x="118" y="233" fill="#d1fae5" font-weight="700">RX0</text>
    <text x="118" y="248" fill="#6b7280">TX0</text>
    <text x="118" y="263" fill="#d1fae5" font-weight="700">GND</text>
    <text x="118" y="278" fill="#d1fae5" font-weight="700">3V3</text>
    <text x="118" y="293" fill="#6b7280">BOOT</text>
    <text x="118" y="308" fill="#6b7280">RST</text>
  </g>

  <!-- HUB75 box header (ribbon alternative) -->
  <rect x="170" y="330" width="64" height="26" rx="2" fill="#0b0d10" stroke="#3f4854"/>
  <text x="202" y="346" font-size="7" fill="#6b7280" text-anchor="middle">HUB75</text>

  <!-- IN socket hidden beneath the board -->
  <rect x="240" y="268" width="34" height="96" fill="none" stroke="#94d3a2" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text transform="rotate(-90 232 316)" x="232" y="319" font-size="9" fill="#94d3a2" text-anchor="middle">IN socket (under board)</text>

  <!-- VH-4P 5V-out connector on the board's bottom edge -->
  <rect x="112" y="352" width="52" height="26" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <g fill="#9ca3af"><rect x="120" y="358" width="5" height="14"/><rect x="131" y="358" width="5" height="14"/><rect x="142" y="358" width="5" height="14"/><rect x="153" y="358" width="5" height="14"/></g>
  <text x="138" y="348" font-size="7.5" fill="#cbd5e1" text-anchor="middle">5V OUT</text>

  <!-- panel power harness: board 5V OUT -> panel PWR socket -->
  <path d="M126,378 C126,414 114,424 106,430" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <path d="M148,378 C148,428 122,442 106,450" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>

  <!-- ============ GY-BNO08X IMU, mid-panel ============ -->
  <rect x="330" y="446" width="104" height="22" rx="3" fill="#e7e5e4" opacity="0.4"/>
  <rect x="340" y="340" width="84" height="126" rx="6" fill="#6d28d9" stroke="#4c1d95" stroke-width="2"/>
  <rect x="380" y="382" width="26" height="26" rx="2" fill="#111827"/>
  <text transform="rotate(-90 415 402)" x="415" y="405" font-size="9" font-weight="600" fill="#ddd6fe" text-anchor="middle">GY-BNO08X</text>

  <!-- 10-pin header on the IMU's left edge, VCC (top) ... PS0 (bottom) -->
  <g stroke="#92702a">
    <circle cx="346" cy="350" r="2.6" fill="#d4af37"/>
    <circle cx="346" cy="362" r="2.6" fill="#d4af37"/>
    <circle cx="346" cy="374" r="2.6" fill="#d4af37"/>
    <circle cx="346" cy="386" r="2.6" fill="#d4af37"/>
    <circle cx="346" cy="398" r="2.6" fill="#d4af37"/>
    <circle cx="346" cy="410" r="2.6" fill="#d4af37"/>
    <circle cx="346" cy="422" r="2.6" fill="#d4af37"/>
    <circle cx="346" cy="434" r="2.6" fill="#d4af37"/>
    <circle cx="346" cy="446" r="2.6" fill="#d4af37"/>
    <circle cx="346" cy="458" r="2.6" fill="#d4af37"/>
  </g>
  <g font-size="7" fill="#ede9fe">
    <text x="354" y="353">VCC</text>
    <text x="354" y="365">GND</text>
    <text x="354" y="377">SCL</text>
    <text x="354" y="389">SDA</text>
    <text x="354" y="401">AD0</text>
    <text x="354" y="413">CS</text>
    <text x="354" y="425">INT</text>
    <text x="354" y="437">RST</text>
    <text x="354" y="449">PS1</text>
    <text x="354" y="461">PS0</text>
  </g>
  <!-- JST plugs: 4-pin on VCC..SDA, 2-pin on PS1/PS0 -->
  <rect x="332" y="344" width="11" height="48" rx="2" fill="#f5f5f4" stroke="#a8a29e"/>
  <rect x="332" y="440" width="11" height="24" rx="2" fill="#f5f5f4" stroke="#a8a29e"/>

  <!-- UART-RVC harness: IMU -> left-edge header (routed under the board) -->
  <g fill="none" stroke-width="2.6" stroke-linecap="round">
    <!-- gray: VCC -> 3V3 -->
    <path d="M332,350 C314,350 310,354 310,366 L310,382 C310,392 302,396 292,396 L92,396 C82,396 78,392 78,384 L78,212 C78,204 84,200 92,200 L103,200" stroke="#64748b"/>
    <!-- violet: GND -> GND -->
    <path d="M332,362 C316,362 313,366 313,376 L313,388 C313,398 306,401 296,401 L94,401 C86,401 82,397 82,390 L82,196 C82,189 88,185 95,185 L103,185" stroke="#7c3aed"/>
    <!-- green: TX (SDA pin) -> RX0 -->
    <path d="M332,386 C320,386 316,390 316,398 C316,404 310,406 300,406 L98,406 C90,406 86,402 86,395 L86,241 C86,234 92,230 99,230 L103,230" stroke="#16a34a"/>
    <!-- black: PS1 -> GND -->
    <path d="M332,446 C316,446 308,442 308,432 L308,422 C308,415 302,411 293,411 L100,411 C92,411 90,406 90,399 L90,271 C90,264 95,260 101,260 L103,260" stroke="#1f2937"/>
    <!-- red: PS0 -> 3V3 -->
    <path d="M332,458 C312,458 304,452 304,442 L304,428 C304,420 298,416 289,416 L104,416 C96,416 94,410 94,403 L94,286 C94,279 98,275 104,275" stroke="#dc2626"/>
  </g>

  <!-- ============ callouts, right column ============ -->
  <g font-size="12" fill="#475569">
    <g>
      <text x="656" y="130" font-size="14" font-weight="700" fill="#0f172a">HUB75 S3 controller</text>
      <text x="656" y="148">Plugs onto the panel's IN socket via its rear header —</text>
      <text x="656" y="164">seat it firmly. USB ports and wheel face the top edge.</text>
      <line x1="650" y1="140" x2="326" y2="180" stroke="#94a3b8" stroke-dasharray="3 3" marker-end="url(#dot)"/>
    </g>
    <g>
      <text x="656" y="212" font-size="14" font-weight="700" fill="#0f172a">GY-BNO08X tilt sensor</text>
      <text x="656" y="230">Taped flat mid-panel, square to the edges, 10-pin</text>
      <text x="656" y="246">header toward the board (VCC at top … PS0 at bottom).</text>
      <line x1="650" y1="222" x2="430" y2="360" stroke="#94a3b8" stroke-dasharray="3 3" marker-end="url(#dot)"/>
    </g>
    <g>
      <text x="656" y="300" font-size="14" font-weight="700" fill="#0f172a">Wire colors (reference build)</text>
      <line x1="656" y1="318" x2="688" y2="318" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><text x="696" y="322">VCC → 3V3</text>
      <line x1="800" y1="318" x2="832" y2="318" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><text x="840" y="322">GND → GND</text>
      <line x1="656" y1="342" x2="688" y2="342" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/><text x="696" y="346">TX (SDA) → RX0</text>
      <line x1="800" y1="342" x2="832" y2="342" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/><text x="840" y="346">PS0 → 3V3</text>
      <line x1="656" y1="366" x2="688" y2="366" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/><text x="696" y="370">PS1 → GND</text>
      <text x="656" y="394" font-size="11" fill="#94a3b8">Colors follow the photos in this repo — always trust</text>
      <text x="656" y="409" font-size="11" fill="#94a3b8">silkscreen names over wire colors.</text>
    </g>
    <g>
      <text x="656" y="500" font-size="14" font-weight="700" fill="#0f172a">Panel 5 V power</text>
      <text x="656" y="518">Board VH-4P "5V OUT" terminal → panel's power</text>
      <text x="656" y="534">socket (≤5 V / 4 A). Connect before seating the board.</text>
      <line x1="650" y1="510" x2="155" y2="445" stroke="#94a3b8" stroke-dasharray="3 3" marker-end="url(#dot)"/>
    </g>
    <g>
      <text x="656" y="582" font-size="14" font-weight="700" fill="#0f172a">Tilt wrong way?</text>
      <text x="656" y="600">Settings → TILT quarter-turns the mapping;</text>
      <text x="656" y="616">Settings → FLIP mirrors it. No reflash needed.</text>
    </g>
  </g>

  <!-- ============ harness callout, below panel ============ -->
  <g font-size="12" fill="#475569">
    <line x1="200" y1="686" x2="200" y2="420" stroke="#94a3b8" stroke-dasharray="3 3" marker-end="url(#dot)"/>
    <text x="90" y="706" font-size="14" font-weight="700" fill="#0f172a">UART-RVC harness — 5 wires</text>
    <text x="90" y="724">VCC→3V3 · GND→GND · TX (the SDA pin)→RX0, plus PS0→3V3 and PS1→GND straps that select RVC mode.</text>
    <text x="90" y="740">Routed under the board's lower edge to the RST…IO46 pin header. SCL · AD0 · CS · INT · RST stay empty.</text>
  </g>
</svg>
