<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="2.4" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1000" height="780" fill="#f8fafc"/>

  <!-- Title -->
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">PixelTilt — wiring overview (panel rear view)</text>
  <text x="40" y="72" font-size="14" fill="#64748b">Seengreat HUB75 S3 board direct-mounted on the IN socket · GY-BNO08x stuck mid-panel</text>

  <!-- ============ 64x64 panel, rear ============ -->
  <rect x="60" y="100" width="560" height="560" rx="12" fill="#1f242b" stroke="#3a4149" stroke-width="2"/>
  <!-- faint ribs -->
  <line x1="60" y1="240" x2="620" y2="240" stroke="#272d35" stroke-width="2"/>
  <line x1="60" y1="380" x2="620" y2="380" stroke="#272d35" stroke-width="2"/>
  <line x1="60" y1="520" x2="620" y2="520" stroke="#272d35" stroke-width="2"/>
  <!-- mounting holes -->
  <g fill="#0c0f12" stroke="#4b5563">
    <circle cx="86"  cy="126" r="8"/><circle cx="594" cy="126" r="8"/>
    <circle cx="86"  cy="634" r="8"/><circle cx="594" cy="634" r="8"/>
    <circle cx="340" cy="126" r="8"/><circle cx="340" cy="634" r="8"/>
    <circle cx="86"  cy="380" r="8"/><circle cx="594" cy="380" r="8"/>
  </g>
  <text x="340" y="652" font-size="12" fill="#6b7280" text-anchor="middle">64 × 64 HUB75 panel (rear)</text>

  <!-- silkscreen data-direction arrows (point away from IN, toward OUT) -->
  <g stroke="#6b7280" stroke-width="2" fill="#6b7280">
    <line x1="350" y1="330" x2="430" y2="330"/>
    <path d="M430,330 l-10,-5 v10 z"/>
  </g>
  <text x="390" y="320" font-size="11" fill="#6b7280" text-anchor="middle">data</text>

  <!-- OUT socket (unused) -->
  <rect x="470" y="350" width="96" height="40" rx="3" fill="#0b0e11" stroke="#52606d"/>
  <g fill="#d4af37">
    <circle cx="482" cy="362" r="2.2"/><circle cx="494" cy="362" r="2.2"/><circle cx="506" cy="362" r="2.2"/><circle cx="518" cy="362" r="2.2"/>
    <circle cx="530" cy="362" r="2.2"/><circle cx="542" cy="362" r="2.2"/><circle cx="554" cy="362" r="2.2"/>
    <circle cx="482" cy="378" r="2.2"/><circle cx="494" cy="378" r="2.2"/><circle cx="506" cy="378" r="2.2"/><circle cx="518" cy="378" r="2.2"/>
    <circle cx="530" cy="378" r="2.2"/><circle cx="542" cy="378" r="2.2"/><circle cx="554" cy="378" r="2.2"/>
  </g>
  <text x="518" y="408" font-size="12" fill="#9ca3af" text-anchor="middle">OUT (unused)</text>

  <!-- panel power connector (VH-4P on panel) -->
  <rect x="320" y="480" width="76" height="42" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
  <g fill="#9ca3af">
    <rect x="330" y="490" width="6" height="22"/><rect x="346" y="490" width="6" height="22"/>
    <rect x="362" y="490" width="6" height="22"/><rect x="378" y="490" width="6" height="22"/>
  </g>
  <text x="358" y="538" font-size="11" fill="#9ca3af" text-anchor="middle">panel PWR in</text>

  <!-- ============ Seengreat HUB75 S3 board (plugged onto IN socket) ============ -->
  <rect x="100" y="250" width="230" height="190" rx="8" fill="#163a24" stroke="#2f855a" stroke-width="2"/>
  <text x="215" y="266" font-size="11" fill="#a7f3d0" text-anchor="middle">Seengreat RGB Matrix HUB75 S3</text>

  <!-- ESP32-S3 module shield -->
  <rect x="120" y="276" width="100" height="60" rx="4" fill="#aab3bd" stroke="#7b8794"/>
  <rect x="120" y="276" width="18"  height="60" fill="#c9d1d9"/>
  <text x="178" y="310" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle">ESP32-S3</text>

  <!-- IN socket hidden beneath the board -->
  <rect x="165" y="345" width="96" height="34" fill="none" stroke="#94d3a2" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="213" y="392" font-size="10" fill="#94d3a2" text-anchor="middle">HUB75 IN socket (under board)</text>

  <!-- thumb wheel on left edge -->
  <rect x="92" y="352" width="14" height="44" rx="6" fill="#52606d" stroke="#333"/>
  <text x="113" y="360" font-size="9" fill="#a7f3d0">wheel</text>

  <!-- I2C header on right edge -->
  <g stroke="#92702a">
    <circle cx="326" cy="292" r="3.5" fill="#d4af37"/>
    <circle cx="326" cy="307" r="3.5" fill="#d4af37"/>
    <circle cx="326" cy="322" r="3.5" fill="#d4af37"/>
    <circle cx="326" cy="337" r="3.5" fill="#d4af37"/>
  </g>
  <g font-size="9" fill="#d1fae5" text-anchor="end">
    <text x="318" y="295">3V3</text>
    <text x="318" y="310">SDA</text>
    <text x="318" y="325">SCL</text>
    <text x="318" y="340">GND</text>
  </g>

  <!-- VH-4P 5V-out screw terminal -->
  <rect x="250" y="398" width="64" height="34" rx="3" fill="#15803d" stroke="#14532d"/>
  <g fill="#052e16">
    <circle cx="262" cy="415" r="5"/><circle cx="279" cy="415" r="5"/><circle cx="296" cy="415" r="5"/>
  </g>
  <text x="282" y="394" font-size="9" fill="#a7f3d0" text-anchor="middle">5 V OUT</text>

  <!-- two USB-C ports on bottom edge -->
  <rect x="140" y="432" width="34" height="14" rx="6" fill="#cbd5e1" stroke="#64748b"/>
  <rect x="190" y="432" width="34" height="14" rx="6" fill="#cbd5e1" stroke="#64748b"/>
  <text x="157" y="460" font-size="9" fill="#94a3b8" text-anchor="middle">USB main</text>
  <text x="207" y="460" font-size="9" fill="#94a3b8" text-anchor="middle">USB pwr</text>

  <!-- USB cable leaving the panel -->
  <path d="M157,446 C157,540 130,620 118,700" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <text x="130" y="722" font-size="12" fill="#475569">USB-C — power + flashing</text>

  <!-- ============ GY-BNO08x IMU, mid-panel ============ -->
  <rect x="420" y="180" width="130" height="86" rx="6" fill="#4338ca" stroke="#312e81" stroke-width="2"/>
  <rect x="474" y="196" width="38" height="38" rx="2" fill="#111827"/>
  <text x="493" y="252" font-size="11" font-weight="600" fill="#c7d2fe" text-anchor="middle">GY-BNO08x</text>
  <g stroke="#92702a">
    <circle cx="428" cy="196" r="3.5" fill="#d4af37"/>
    <circle cx="428" cy="214" r="3.5" fill="#d4af37"/>
    <circle cx="428" cy="232" r="3.5" fill="#d4af37"/>
    <circle cx="428" cy="250" r="3.5" fill="#d4af37"/>
  </g>
  <g font-size="9" fill="#e0e7ff">
    <text x="437" y="199">VCC</text>
    <text x="437" y="217">SDA</text>
    <text x="437" y="235">SCL</text>
    <text x="437" y="253">GND</text>
  </g>

  <!-- I2C wires: board header -> IMU -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M326,292 C372,286 380,200 424,196" stroke="#dc2626"/>
    <path d="M326,307 C372,303 382,218 424,214" stroke="#2563eb"/>
    <path d="M326,322 C372,320 384,234 424,232" stroke="#eab308"/>
    <path d="M326,337 C372,337 386,251 424,250" stroke="#1f2937"/>
  </g>

  <!-- panel power harness: board terminal -> panel connector -->
  <path d="M266,432 C266,472 300,486 328,496" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <path d="M284,432 C284,466 308,478 330,506" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>

  <!-- ============ callouts ============ -->
  <g font-size="12" fill="#475569">
    <g>
      <text x="656" y="142" font-size="14" font-weight="700" fill="#0f172a">HUB75 S3 controller</text>
      <text x="656" y="160">Plugs straight onto the panel's IN socket via its</text>
      <text x="656" y="176">rear header — seat it firmly (half-seated = dark panel).</text>
      <line x1="650" y1="150" x2="300" y2="258" stroke="#94a3b8" stroke-dasharray="3 3" marker-end="url(#dot)"/>
    </g>
    <g>
      <text x="656" y="216" font-size="14" font-weight="700" fill="#0f172a">GY-BNO08x tilt sensor</text>
      <text x="656" y="234">Mount flat mid-panel (foam tape or standoffs),</text>
      <text x="656" y="250">square to the panel edges.</text>
      <line x1="650" y1="224" x2="556" y2="220" stroke="#94a3b8" stroke-dasharray="3 3" marker-end="url(#dot)"/>
    </g>
    <g>
      <text x="656" y="292" font-size="14" font-weight="700" fill="#0f172a">4-wire I2C harness</text>
      <text x="656" y="310">3V3 · GND · SDA→GPIO 1 · SCL→GPIO 2</text>
      <text x="656" y="326">(pin detail: see the pinout diagram)</text>
      <line x1="650" y1="300" x2="420" y2="285" stroke="#94a3b8" stroke-dasharray="3 3" marker-end="url(#dot)"/>
    </g>
    <g>
      <text x="656" y="382" font-size="14" font-weight="700" fill="#0f172a">OUT socket</text>
      <text x="656" y="400">Leave empty — single-panel build.</text>
      <line x1="650" y1="390" x2="572" y2="372" stroke="#94a3b8" stroke-dasharray="3 3" marker-end="url(#dot)"/>
    </g>
    <g>
      <text x="656" y="452" font-size="14" font-weight="700" fill="#0f172a">Panel 5 V power</text>
      <text x="656" y="470">Board VH-4P terminal → panel power connector.</text>
      <text x="656" y="486">Max 5 V / 4 A — connect before seating the board.</text>
      <line x1="650" y1="460" x2="400" y2="498" stroke="#94a3b8" stroke-dasharray="3 3" marker-end="url(#dot)"/>
    </g>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#475569">
    <text x="656" y="560" font-size="13" font-weight="700" fill="#0f172a">Wire colors</text>
    <line x1="656" y1="580" x2="688" y2="580" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/><text x="696" y="584">3V3</text>
    <line x1="740" y1="580" x2="772" y2="580" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/><text x="780" y="584">GND</text>
    <line x1="656" y1="604" x2="688" y2="604" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><text x="696" y="608">SDA</text>
    <line x1="740" y1="604" x2="772" y2="604" stroke="#eab308" stroke-width="4" stroke-linecap="round"/><text x="780" y="608">SCL</text>
    <line x1="656" y1="628" x2="688" y2="628" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
    <line x1="656" y1="638" x2="688" y2="638" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
    <text x="696" y="637">5 V panel power (heavy gauge)</text>
  </g>
</svg>
