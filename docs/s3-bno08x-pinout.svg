<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 424" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .bg    { fill: #f8fafc; }
    .pill  { fill: #ffffff; stroke: #e2e8f0; }
    .plab  { fill: #334155; }
    .wVcc  { stroke: #64748b; }
    .wPs1  { stroke: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .pill { fill: #161b22; stroke: #30363d; }
      .plab { fill: #c9d1d9; }
      .wVcc { stroke: #e6edf3; }
      .wPs1 { stroke: #6b7684; }
    }
  </style>

  <rect class="bg" width="860" height="424"/>

  <!-- ============ S3 board ============ -->
  <rect x="70" y="24" width="250" height="380" rx="10" fill="#14161c" stroke="#6b7280" stroke-width="2"/>
  <text x="195" y="54" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Seengreat HUB75 S3</text>
  <text x="195" y="72" font-size="11" fill="#94a3b8" text-anchor="middle">(ESP32-S3-WROOM-1)</text>

  <g stroke="#92702a">
    <circle cx="316" cy="104" r="6" fill="#d4af37" opacity="0.35"/>
    <circle cx="316" cy="134" r="6" fill="#d4af37"/>
    <circle cx="316" cy="164" r="6" fill="#d4af37"/>
    <circle cx="316" cy="194" r="6" fill="#d4af37" opacity="0.35"/>
    <circle cx="316" cy="224" r="6" fill="#d4af37"/>
    <circle cx="316" cy="254" r="6" fill="#d4af37" opacity="0.35"/>
    <circle cx="316" cy="284" r="6" fill="#d4af37"/>
    <circle cx="316" cy="314" r="6" fill="#d4af37"/>
    <circle cx="316" cy="344" r="6" fill="#d4af37" opacity="0.35"/>
    <circle cx="316" cy="374" r="6" fill="#d4af37" opacity="0.35"/>
  </g>
  <g font-size="13" text-anchor="end">
    <text x="300" y="108" fill="#64748b">IO46</text>
    <text x="300" y="138" fill="#d1fae5" font-weight="700">GND</text>
    <text x="300" y="168" fill="#d1fae5" font-weight="700">3V3</text>
    <text x="300" y="198" fill="#64748b">IO45</text>
    <text x="300" y="228" fill="#d1fae5" font-weight="700">RX0 (GPIO 44)</text>
    <text x="300" y="258" fill="#64748b">TX0</text>
    <text x="300" y="288" fill="#d1fae5" font-weight="700">GND</text>
    <text x="300" y="318" fill="#d1fae5" font-weight="700">3V3</text>
    <text x="300" y="348" fill="#64748b">BOOT</text>
    <text x="300" y="378" fill="#64748b">RST</text>
  </g>

  <!-- ============ BNO08X ============ -->
  <rect x="540" y="24" width="250" height="380" rx="10" fill="#6d28d9" stroke="#4c1d95" stroke-width="2"/>
  <text x="665" y="54" font-size="15" font-weight="700" fill="#ede9fe" text-anchor="middle">GY-BNO08X IMU</text>
  <text x="665" y="72" font-size="11" fill="#c4b5fd" text-anchor="middle">(BNO080 / BNO085, UART-RVC mode)</text>

  <g stroke="#92702a">
    <circle cx="544" cy="104" r="6" fill="#d4af37"/>
    <circle cx="544" cy="134" r="6" fill="#d4af37"/>
    <circle cx="544" cy="164" r="6" fill="#d4af37" opacity="0.35"/>
    <circle cx="544" cy="194" r="6" fill="#d4af37"/>
    <circle cx="544" cy="224" r="6" fill="#d4af37" opacity="0.35"/>
    <circle cx="544" cy="254" r="6" fill="#d4af37" opacity="0.35"/>
    <circle cx="544" cy="284" r="6" fill="#d4af37" opacity="0.35"/>
    <circle cx="544" cy="314" r="6" fill="#d4af37" opacity="0.35"/>
    <circle cx="544" cy="344" r="6" fill="#d4af37"/>
    <circle cx="544" cy="374" r="6" fill="#d4af37"/>
  </g>
  <g font-size="13" text-anchor="start">
    <text x="560" y="108" fill="#ede9fe" font-weight="700">VCC</text>
    <text x="560" y="138" fill="#ede9fe" font-weight="700">GND</text>
    <text x="560" y="168" fill="#a78bfa">SCL</text>
    <text x="560" y="198" fill="#ede9fe" font-weight="700">SDA, the UART TX pin</text>
    <text x="560" y="228" fill="#a78bfa">AD0</text>
    <text x="560" y="258" fill="#a78bfa">CS</text>
    <text x="560" y="288" fill="#a78bfa">INT</text>
    <text x="560" y="318" fill="#a78bfa">RST</text>
    <text x="560" y="348" fill="#ede9fe" font-weight="700">PS1</text>
    <text x="560" y="378" fill="#ede9fe" font-weight="700">PS0</text>
  </g>

  <!-- ============ wires ============ -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path class="wVcc" d="M322,164 C420,164 440,104 538,104"/>
    <path d="M322,134 L538,134" stroke="#8b5cf6"/>
    <path d="M322,224 C420,224 440,194 538,194" stroke="#22c55e"/>
    <path class="wPs1" d="M322,284 C420,284 440,344 538,344"/>
    <path d="M322,314 C420,314 440,374 538,374" stroke="#ef4444"/>
  </g>
  <g class="plab" font-size="12" text-anchor="middle">
    <g><rect class="pill" x="366" y="88" width="128" height="18" rx="9"/><text x="430" y="101">3V3 &#8594; VCC</text></g>
    <g><rect class="pill" x="366" y="140" width="128" height="18" rx="9"/><text x="430" y="153">GND &#8594; GND</text></g>
    <g><rect class="pill" x="358" y="188" width="144" height="18" rx="9"/><text x="430" y="201">RX0 &#8592; SDA (TX)</text></g>
    <g><rect class="pill" x="366" y="292" width="128" height="18" rx="9"/><text x="430" y="305">GND &#8594; PS1</text></g>
    <g><rect class="pill" x="366" y="356" width="128" height="18" rx="9"/><text x="430" y="369">3V3 &#8594; PS0</text></g>
  </g>
</svg>
