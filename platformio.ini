; PixelTilt firmware for the Seengreat RGB Matrix HUB75 S3.
;   pio run              build
;   pio run -t upload    build + flash over USB-C
;   pio device monitor   serial console (115200)
[platformio]
default_envs = hub75s3
src_dir = .

[env:hub75s3]
platform = espressif32@^6.9.0
framework = arduino
; ESP32-S3-WROOM-1-N16R8: 16 MB QIO flash, 8 MB octal PSRAM
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200

build_flags =
    -Icore/include
    -Ifirmware/src
    -DBOARD_HAS_PSRAM
    ; we blit our own framebuffer; skip the Adafruit_GFX dependency entirely
    -DNO_GFX
    -O2

build_src_filter =
    +<firmware/src/>
    +<core/src/>
    +<games/>
    -<games/_template/>

lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.12
    sparkfun/SparkFun BNO08x Cortex Based IMU@^1.0.6

extra_scripts = pre:firmware/gen_games.py
