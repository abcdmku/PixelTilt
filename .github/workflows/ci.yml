name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache wasi-sdk
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: wasi-sdk-${{ runner.os }}-25
      - run: npm ci
      - name: Build wasm + run engine smoke test
        run: npm test
      - name: Build frontend
        run: npm --workspace frontend run build

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Build ESP32-S3 firmware
        run: pio run
